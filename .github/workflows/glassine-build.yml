name: glassine-build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: sh build-glassine.sh "$PWD/out"
      - run: sh test/gesture-action-test.sh
      - run: sh test/gesture-edge-test.sh
      - run: sh test/ink-popup-test.sh "$PWD/out/sway-glassine"
      - run: sh test/handwriting-test.sh "$PWD/out/sway-glassine"
      - run: sudo apt-get install -y -q libwayland-dev libjson-c-dev && sh test/handwriting-standin.sh
      - run: sh test/shm-seal-test.sh
